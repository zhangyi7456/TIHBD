name: Update asset cycle data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:asset-cycle
      - run: npm test
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset-cycle.real.json
          git diff --cached --quiet || git commit -m "data: refresh weekly asset cycle snapshot"
          git push
